apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      name: simulator-pod
      labels:
        app: simulator
    spec:
      containers:
        - name: simulator
          image: acrdevproject4480.azurecr.io/simulator:v2
          ports:
            - containerPort: 8000