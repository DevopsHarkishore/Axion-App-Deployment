name: Build, Push and Deploy to AKS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            axion-data-simulator: 'app-code/axion-data-simulator/**'
            axion-ingestion-service: 'app-code/axion-ingestion-service/**'
            axion-telemetry-query-service: 'app-code/axion-telemetry-query-service/**'
            axion-ui: 'app-code/axion-ui/**'

  build-and-push:
    name: Build & Push Images
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name acrdevproject4480

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: acrdevproject4480.azurecr.io/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: app-code/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-aks:
    name: Deploy Manifests to AKS
    needs: [changes, build-and-push]
    if: |
      always() && 
      needs.changes.result == 'success' && 
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS Credentials
        uses: azure/aks-set-context@v3
        with:
          resource-group: rg-aks-test
          cluster-name: aks-cluster
        
      # Deploy databases
      - name: Deploy Databases
        run: |
          if [ -d "axion-database" ]; then kubectl apply -f axion-database/; fi
          if [ -d "pgadmin" ]; then kubectl apply -f pgadmin/; fi

      # Deploy backend services
      - name: Deploy Backend Services
        run: |
          if [ -d "ingestion" ]; then kubectl apply -f ingestion/; fi
          if [ -d "telemetry" ]; then kubectl apply -f telemetry/; fi
          if [ -d "simulator" ]; then kubectl apply -f simulator/; fi

      # Deploy frontend
      - name: Deploy UI
        run: |
          if [ -d "axion-ui" ]; then kubectl apply -f axion-ui/; fi
